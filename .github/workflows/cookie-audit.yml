name: Cookie consent audit

# Runs the audit on a GitHub-hosted runner, which has the open network access
# the audit needs. Use this when installing Claude Code locally is not an
# option: Actions tab -> Cookie consent audit -> Run workflow -> enter a URL.
#
# Geography: GitHub's runners are US-based, and consent banners are commonly
# geo-targeted on the visitor's IP. For a European test, set an AUDIT_PROXY
# repository secret to an egress proxy in the region; locale and timezone alone
# do not move IP-based targeting.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Site to audit, e.g. https://example.com'
        required: true
        type: string
      site_name:
        description: 'Name for the report title (defaults to the domain)'
        required: false
        type: string
      paths:
        description: 'Pages to always visit, comma-separated'
        required: false
        type: string
        default: '/'
      discover:
        description: 'Additionally discover this many pages from the site navigation (0 to disable)'
        required: false
        type: string
        default: '8'
      runs:
        description: 'Repeat the whole capture this many times and report which findings held every time'
        required: false
        type: string
        default: '1'
      locale:
        description: 'Browser locale, e.g. en-GB (does not change the IP the site sees)'
        required: false
        type: string
      timezone:
        description: 'Browser timezone, e.g. Europe/London (does not change the IP the site sees)'
        required: false
        type: string
      skip_categories:
        description: 'Skip per-category consent testing (faster, less thorough)'
        required: false
        type: boolean
        default: false
      accept_selector:
        description: 'CSS selector for the Accept button (only if auto-detection fails)'
        required: false
        type: string
      reject_selector:
        description: 'CSS selector for the Reject button (only if auto-detection fails)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Each run was otherwise downloading Chrome for Testing, the headless
      # shell and ffmpeg from scratch — about 300 MB and ~20s of the run, and a
      # pointless load on Playwright's CDN. Keyed on package.json so a
      # Playwright version bump invalidates it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('plugins/cookie-consent-audit/skills/cookie-consent-audit/scripts/package.json') }}

      # Done here rather than leaving it to run_audit.sh so that Chromium's
      # system libraries (--with-deps) are installed too. The script's own
      # install step then finds the browser already present and no-ops.
      - name: Install dependencies and Chromium
        working-directory: plugins/cookie-consent-audit/skills/cookie-consent-audit/scripts
        run: |
          npm install
          npx playwright install --with-deps chromium

      # Inputs are passed through env, never interpolated into the script body,
      # so a URL cannot inject shell. The proxy comes from a secret rather than
      # an input because workflow inputs are recorded in the run log.
      - name: Run audit
        id: run
        env:
          URL: ${{ inputs.url }}
          SITE_NAME: ${{ inputs.site_name }}
          PATHS: ${{ inputs.paths }}
          DISCOVER: ${{ inputs.discover }}
          RUNS: ${{ inputs.runs }}
          LOCALE: ${{ inputs.locale }}
          TIMEZONE: ${{ inputs.timezone }}
          SKIP_CATEGORIES: ${{ inputs.skip_categories }}
          ACCEPT_SELECTOR: ${{ inputs.accept_selector }}
          REJECT_SELECTOR: ${{ inputs.reject_selector }}
          CONSENT_AUDIT_PROXY: ${{ secrets.AUDIT_PROXY }}
        run: |
          set -euo pipefail
          mkdir -p out && cd out

          args=("$URL")
          if [ -n "$SITE_NAME" ]; then args+=("$SITE_NAME"); fi
          if [ -n "$PATHS" ]; then args+=(--paths "$PATHS"); fi
          if [ -n "$DISCOVER" ] && [ "$DISCOVER" != "0" ]; then args+=(--discover "$DISCOVER"); fi
          if [ -n "$RUNS" ] && [ "$RUNS" != "1" ]; then args+=(--runs "$RUNS"); fi
          if [ -n "$LOCALE" ]; then args+=(--locale "$LOCALE"); fi
          if [ -n "$TIMEZONE" ]; then args+=(--timezone "$TIMEZONE"); fi
          if [ "$SKIP_CATEGORIES" = "true" ]; then args+=(--skip-categories); fi
          if [ -n "$ACCEPT_SELECTOR" ]; then args+=(--accept-selector "$ACCEPT_SELECTOR"); fi
          if [ -n "$REJECT_SELECTOR" ]; then args+=(--reject-selector "$REJECT_SELECTOR"); fi

          bash "$GITHUB_WORKSPACE/plugins/cookie-consent-audit/skills/cookie-consent-audit/scripts/run_audit.sh" \
            "${args[@]}" 2>&1 | tee audit.log

      # run_audit.sh exits non-zero when a state failed to LOAD, but not when the
      # consent banner was never found: that run still writes a report, correctly
      # stamped inconclusive. Left alone it would show as a green run with a
      # downloadable report that proves nothing, which is how an untrustworthy
      # document reaches a client. Fail loudly instead; the artifact still
      # uploads so the log can be read for the real selectors.
      #
      # With --runs > 1 every run's analysis is on this log, so one inconclusive
      # run out of several fails the job. That is deliberate: it is worth a look
      # rather than a silent pass.
      - name: Reject an inconclusive run
        if: always() && steps.run.outcome == 'success'
        run: |
          set -euo pipefail
          if grep -qE 'CAPTURE INCONCLUSIVE|NO CONSENT BANNER WAS EXERCISED' out/audit.log; then
            echo "::error::This run is INCONCLUSIVE and proves nothing about the site."
            echo "The consent banner was never found or a state never loaded, so no"
            echo "consent decision was tested. Do not send the attached report to anyone."
            echo "Find the real Accept/Reject selectors in the page and re-run with the"
            echo "accept_selector / reject_selector inputs."
            exit 1
          fi
          echo "Capture exercised the banner in every state."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cookie-audit-report
          path: |
            out/*.docx
            out/audit.log
            out/audit-*/findings.json
            out/audit-*/run-*/findings.json
          if-no-files-found: warn
          retention-days: 30
